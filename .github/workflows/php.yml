name: PHP Composer

on:
  push:
    branches: [ "main", "staging", "feature/*" ]
  pull_request:
    branches: [ "main", "staging" ]

permissions:
  contents: read

defaults:
  run:
    working-directory: dev/system/storage   # onde vive o composer.json (ADR 0003)

jobs:
  composer:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.2'
        extensions: mbstring, curl, gd, zip, intl

    - name: Validate composer.json and composer.lock
      run: composer validate --strict

    - name: Cache Composer packages
      id: composer-cache
      uses: actions/cache@v4
      with:
        path: dev/system/storage/vendor
        key: ${{ runner.os }}-php-${{ hashFiles('**/composer.lock') }}
        restore-keys: |
          ${{ runner.os }}-php-

    - name: Install dependencies
      run: composer install --prefer-dist --no-progress --no-interaction

  php-lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.2'

    - name: PHP syntax check (todos os arquivos de dev/, exceto vendor)
      run: |
        find dev -name "*.php" -not -path "*/storage/vendor/*" -print0 \
          | xargs -0 -n1 -P4 php -l -d display_errors=0 \
          || exit 1

  docs-links:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Link check (docs, agents-ia e README)
      uses: lycheeverse/lychee-action@v1
      with:
        args: >-
          --verbose
          --no-progress
          --exclude 'reamurcms\.com'
          --exclude 'wa\.me'
          --exclude 'davidalmeida\.xyz/catalog/tools'
          './**/*.md'
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  static-analysis:
    runs-on: ubuntu-latest
    # Fase 1·Tarefa 6c: BLOQUEANTE — núcleo completo (engine/+library/+helper/) e run verde
    # validados localmente (0 errors, PHPStan level 2). Constantes do Contrato §1.1 são
    # simuladas por dev/system/storage/phpstan-bootstrap.php (bootstrapFiles).
    steps:
    - uses: actions/checkout@v4

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.2'
        extensions: mbstring, curl, gd, zip, intl

    - name: Cache Composer packages
      uses: actions/cache@v4
      with:
        path: dev/system/storage/vendor
        key: ${{ runner.os }}-phpstan-${{ hashFiles('**/composer.lock') }}

    - name: Install dependencies
      run: composer install --prefer-dist --no-progress --no-interaction

    - name: PHPStan (nível 2 — subir por fase, ADR 0004)
      run: composer analyse
