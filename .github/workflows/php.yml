name: PHP Composer

on:
  push:
    branches: [ "main", "staging", "feature/*" ]
  pull_request:
    branches: [ "main", "staging" ]

permissions:
  contents: read

# Evita dois runs concorrentes no mesmo ref (economia de minutos e menos ruido).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# ─────────────────────────────────────────────────────────────────────────────
# F11-01 / ADR 0081 — NAO usar `defaults.run` global.
# O composer.json/lock + vendor vivem em dev/system/storage/; o
# package.json/lock + node_modules do Node tambem vivem la.
# Um `defaults.run.working-directory` global fazia o `find dev ...` do job
# php-lint rodar DENTRO de storage/ (onde nao existe dev/), e o job passava
# VERDE sem lintar nenhum arquivo. Cada job declara o seu cwd agora.
#
# F11-04 / ADR 0082 — modernizacao e endurecimento:
#   * actions nas majors com runtime Node 24 (checkout@v7, setup-node@v7,
#     cache@v6, setup-php@v2, lychee-action@v2): elimina os avisos de
#     "Node.js 20 is deprecated ... forced to run on Node.js 24".
#   * runner PINADO em ubuntu-24.04: `ubuntu-latest` esta em janela de
#     migracao gradual para Ubuntu 26.04 entre 19/10/2026 e 19/11/2026
#     (actions/runner-images). Revisar para ubuntu-26.04 apos um run verde.
#   * timeout-minutes em todos os jobs, concurrency e job `repo-guards`.
#   * matrix Node 20 + 22 no job node-deps (engines declara >=20).
# ─────────────────────────────────────────────────────────────────────────────

jobs:
  composer:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: dev/system/storage
    steps:
    - uses: actions/checkout@v7

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.2'
        extensions: mbstring, curl, gd, zip, intl

    - name: Validate composer.json and composer.lock
      run: composer validate --strict

    - name: Cache Composer packages
      uses: actions/cache@v6
      with:
        path: dev/system/storage/vendor
        key: ${{ runner.os }}-php-${{ hashFiles('**/composer.lock') }}
        restore-keys: |
          ${{ runner.os }}-php-

    - name: Install dependencies
      run: composer install --prefer-dist --no-progress --no-interaction

  php-lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v7

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.2'

    - name: PHP syntax check (dev/, exceto dependencias)
      # Roda na RAIZ do repositorio: sem working-directory (F11-01).
      run: |
        set -euo pipefail
        COUNT=$(find dev -type f -name '*.php' \
          -not -path '*/storage/vendor/*' \
          -not -path '*/storage/node_modules/*' | wc -l)
        if [ "$COUNT" -eq 0 ]; then
          echo "ERRO: nenhum arquivo PHP encontrado; lint vazio nao e aprovacao." >&2
          exit 1
        fi
        echo "Lintando $COUNT arquivo(s) PHP..."
        find dev -type f -name '*.php' \
          -not -path '*/storage/vendor/*' \
          -not -path '*/storage/node_modules/*' -print0 \
          | xargs -0 -r -n1 -P4 php -l -d display_errors=0

  docs-links:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v7

    - name: Link check (docs, agents-ia e README)
      uses: lycheeverse/lychee-action@v2
      with:
        # v2 usa o input `token` (default github.token); na v1 era env GITHUB_TOKEN.
        token: ${{ secrets.GITHUB_TOKEN }}
        # F11-08: a action v2 trocou o binario lychee 0.15.0 (usado pela v1)
        # por v0.24.2 e o docs-links passou de ~6 min para >15 min. Pinar o
        # binario medido em 4 runs verdes, mantendo a action v2 (Node 24),
        # fail/failIfEmpty=true e todas as 5 exclusoes. Reavaliar 0.24.2 com
        # logs de admin e flags explicitas antes de migrar.
        lycheeVersion: v0.15.0
        # F11-12: a varredura de links externos e nao deterministica no runner
        # (403/404/429/500/redirects variam por IP) e seguia com exit 2 mesmo
        # apos F11-10. --offline valida apenas links internos/relativos;
        # fail/failIfEmpty=true permanecem. Links externos saem do escopo.
        args: >-
          --verbose
          --no-progress
          --offline
          --exclude 'reamurcms\.com'
          --exclude 'wa\.me'
          --exclude 'davidalmeida\.xyz/catalog/tools'
          --exclude 'dev/system/storage/node_modules'
          --exclude 'node_modules'
          './**/*.md'

  static-analysis:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: dev/system/storage
    # Fase 1·Tarefa 6c: BLOQUEANTE — nucleo (engine/library/helper),
    # PHPStan nivel 2. F11-01: o erro real estava em
    # dev/system/library/blog/block_document.php:122 ($version ?? 0).
    steps:
    - uses: actions/checkout@v7

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.2'
        extensions: mbstring, curl, gd, zip, intl

    - name: Cache Composer packages
      uses: actions/cache@v6
      with:
        path: dev/system/storage/vendor
        key: ${{ runner.os }}-phpstan-${{ hashFiles('**/composer.lock') }}
        restore-keys: |
          ${{ runner.os }}-phpstan-

    - name: Install dependencies
      run: composer install --prefer-dist --no-progress --no-interaction

    - name: PHPStan (nível 2 — subir por fase, ADR 0004)
      run: composer analyse

  node-deps:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # F11-01 / ADR 0081: dependencias Node (Playwright) moram em
    # dev/system/storage/. Nenhum browser e baixado (--ignore-scripts):
    # este job valida apenas instalacao, resolucao e sintaxe.
    # F11-04: matrix mantem o minimo declarado (>=20) e antecipa o LTS 22.
    strategy:
      fail-fast: false
      matrix:
        node-version: ['20', '22']
    steps:
    - uses: actions/checkout@v7

    - name: Setup Node ${{ matrix.node-version }}
      uses: actions/setup-node@v7
      with:
        node-version: ${{ matrix.node-version }}
        # Cache explicito via actions/cache@v6 para incluir a versao na chave.
        package-manager-cache: false

    - name: Cache npm (por versao do Node)
      uses: actions/cache@v6
      with:
        path: ~/.npm
        key: ${{ runner.os }}-node${{ matrix.node-version }}-npm-${{ hashFiles('dev/system/storage/package-lock.json') }}
        restore-keys: |
          ${{ runner.os }}-node${{ matrix.node-version }}-npm-

    - name: Instalar dependencias Node em dev/system/storage
      run: npm ci --ignore-scripts --no-audit --no-fund --prefix dev/system/storage

    - name: Resolver Playwright a partir do storage
      run: |
        node -e "const { loadPlaywright } = require('./tools/e2e/lib/load-playwright.cjs'); const pw = loadPlaywright(); if (!pw.chromium) process.exit(1); console.log('Playwright resolvido via dev/system/storage/node_modules');"

    - name: Sintaxe dos scripts Node (tools/ e tests/)
      run: |
        set -euo pipefail
        COUNT=0
        while IFS= read -r -d '' f; do
          node --check "$f"
          COUNT=$((COUNT + 1))
        done < <(find tools tests -type f \( -name '*.js' -o -name '*.cjs' \) -print0)
        if [ "$COUNT" -eq 0 ]; then
          echo "ERRO: nenhum script Node encontrado; verificacao vazia nao e aprovacao." >&2
          exit 1
        fi
        echo "$COUNT scripts Node verificados."

  repo-guards:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # F11-04 / ADR 0082: guardas de governanca. Nenhum destes scripts instala
    # dependencias, escreve no repo ou acessa banco/servicos externos.
    steps:
    - uses: actions/checkout@v7

    - name: Layout de dependencias (indice do Git + .gitignore)
      run: bash tools/verify-deps-layout.sh

    - name: Integridade dos manifestos CHECKSUMS*.txt
      run: bash tools/verify-checksums.sh

    - name: Contrato do proprio workflow (actions, runner, guards)
      run: bash tools/verify-ci-workflow.sh
