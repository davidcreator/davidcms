<!doctype html><html lang="pt-br"><head><meta charset="utf-8"><style>/* ReamurCMS — tema base do site publicado (F3-01, ADR 0019)
   Fixos: 950px; acento índigo da marca DavidCreator. Sem dependências externas. */
:root {
    --bg: var(--theme-surface, #ffffff);
    --ink: #111827;
    --muted: #6b7280;
    --accent: var(--theme-primary, #6d28d9);
    --accent-ink: #ffffff;
    --card: #f8fafc;
    --line: #e5e7eb;
    --radius: 10px;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
img { max-width: 100%; }
a { color: var(--accent); }
h1, h2, h3, h4 { line-height: 1.2; margin: 0 0 12px; }
h2 { font-size: 1.75em; }
.container { max-width: 950px; margin: 0 auto; padding: 0 24px; }
/* ── Páginas de conteúdo (F3-03): head de página, capa, tabela de fatos, galeria ── */
.site-main { padding: 48px 0; }
.page-head { display: flex; justify-content: space-between; align-items: baseline; flex-wrap: wrap; gap: 8px; }
.page-head h1 { margin: 0; }
.back-link { color: var(--muted); text-decoration: none; }
.back-link:hover { color: var(--accent); }
.project-cover { max-width: 100%; border-radius: var(--radius); }
.prose { margin: 16px 0; line-height: 1.7; }
.fact-table { border-collapse: collapse; margin: 16px 0; }
.fact-table th { text-align: left; padding: 4px 12px 4px 0; color: var(--muted); font-weight: 600; }
.muted { color: var(--muted); }
/* ── Páginas de ferramentas (F3-04) ── */
.tool-actions a { color: var(--accent); text-decoration: none; font-weight: 600; font-size: .92em; }
.tool-card .tool-link { color: inherit; text-decoration: none; }
.tool-card .tool-link:hover { color: var(--accent); }
/* ── Latest News — blog externo (F3-05) ── */
.news-card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; }
.news-card h3 { margin: 6px 0 8px; font-size: 1.05rem; line-height: 1.3; }
.news-meta { color: var(--muted); font-size: .8rem; margin: 0; text-transform: uppercase; letter-spacing: .04em; }
.news-cta { color: var(--accent); text-decoration: none; font-weight: 600; font-size: .92em; }
.news-source { margin-top: 20px; font-size: .85rem; color: var(--muted); }
.news-source a { color: var(--accent); text-decoration: none; }
.gallery-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 16px; list-style: none; padding: 0; }
.gallery-grid img { width: 100%; border-radius: var(--radius); }
.section { padding: 56px 0; }
.section + .section { border-top: 1px solid var(--line); }
.section-alt { background: var(--card); }
.lead { color: var(--muted); margin: 0 0 24px; max-width: 760px; }
.kicker { display: block; font-size: .8em; letter-spacing: .12em; text-transform: uppercase; color: var(--accent); font-weight: 700; margin-bottom: 8px; }
.btn { display: inline-block; padding: 12px 22px; border: 1px solid var(--line); border-radius: var(--radius); text-decoration: none; font-weight: 600; color: var(--ink); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn + .btn { margin-left: 10px; }

/* ── Header ───────────────────────────────────────────── */
.site-header { position: sticky; top: 0; z-index: 20; background: rgba(255,255,255,.92); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 24px; padding: 12px 24px; flex-wrap: wrap; }
.brand-chip { display: inline-flex; align-items: center; justify-content: center; width: 34px; height: 34px; border-radius: 8px; background: var(--accent); color: #fff; font-weight: 800; text-decoration: none; }
.brand-name { font-weight: 700; text-decoration: none; color: var(--ink); }
.site-nav { display: flex; gap: 18px; flex-wrap: wrap; align-items: center; }
.site-nav a { color: var(--ink); text-decoration: none; font-size: .95em; }
.site-nav a.cta { background: var(--accent); color: #fff; padding: 8px 14px; border-radius: var(--radius); }
.lang-switcher { margin-left: auto; display: flex; gap: 8px; }
.lang-switcher a { font-size: .8em; color: var(--muted); text-decoration: none; }
.lang-switcher a.active { color: var(--accent); font-weight: 700; }

/* ── Hero ─────────────────────────────────────────────── */
.hero { padding: 96px 0 72px; text-align: center; }

/* ── Hero 3D (F3-02, ADR 0020): cena WebGL em camada atrás do conteúdo ── */
.hero--3d { position: relative; overflow: hidden; color: #f3e8ff; }
.hero-3d__canvas { position: absolute; inset: 0; z-index: 0; }
.hero-3d__canvas canvas { display: block; width: 100%; height: 100%; }
/* Fallback CSS (sem binário): gradiente de marca visível até o 1º frame —
   e permanência única quando WebGL/reduced-motion estiverem bloqueados */
.hero-3d__fallback { position: absolute; inset: 0;
    background: radial-gradient(1200px 600px at 70% 20%, #3b1a80 0%, #1e0b45 55%, #12062b 100%); }
.hero-3d__content { position: relative; z-index: 1; }
.hero--3d h1,
.hero--3d .kicker { color: #fff; }
.hero--3d .tagline { color: #c4b5fd; }
.hero--3d .hero-lead { color: #e0d7f5; }
.hero--3d .social-row a { color: #d8ccf5; }
.hero--3d .social-row a:hover { color: #fff; }
.hero--3d .btn { border-color: rgba(255,255,255,.5); color: #fff; }
.hero--3d .btn.primary { border-color: transparent; background: var(--accent); }
@media (prefers-reduced-motion: reduce) {
    .hero-3d__canvas canvas { display: none; } /* redundância de segurança p/ o boot do JS */
}

/* ── 404 3D (F3-03, ADR 0021): fog de partículas na página de erro ── */
.card-404--3d { position: relative; overflow: hidden; border-radius: var(--radius); min-height: 60vh;
    display: flex; flex-direction: column; justify-content: center; color: #f3e8ff; text-align: center; }
.nf-3d__canvas { position: absolute; inset: 0; z-index: 0; }
.nf-3d__canvas canvas { display: block; width: 100%; height: 100%; }
.nf-3d__fallback { position: absolute; inset: 0;
    background: radial-gradient(900px 480px at 50% 30%, #2a1157 0%, #150832 60%, #0d0520 100%); }
.nf-3d__content { position: relative; z-index: 1; }
.card-404--3d .code { color: #c4b5fd; }
.card-404--3d h1 { color: #fff; }
.card-404--3d .muted { color: #d8ccf5; }
@media (prefers-reduced-motion: reduce) {
    .nf-3d__canvas canvas { display: none; }
}
.hero h1 { font-size: 3em; margin-bottom: 4px; }
.hero .tagline { color: var(--accent); font-weight: 700; font-size: 1.25em; margin: 0 0 12px; }
.hero .hero-lead { color: var(--muted); max-width: 620px; margin: 0 auto 28px; }
.hero .ctas { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
.social-row { display: flex; gap: 14px; justify-content: center; margin-top: 28px; flex-wrap: wrap; }
.social-row a { color: var(--muted); text-decoration: none; font-size: .9em; }
.social-row a:hover { color: var(--accent); }

/* ── Steps / cards ────────────────────────────────────── */
.steps { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px; margin-top: 24px; }
.step-card { border: 1px solid var(--line); border-radius: var(--radius); padding: 20px; background: #fff; }
.step-card .num { display: inline-flex; width: 34px; height: 34px; border-radius: 50%; background: var(--accent); color: #fff; align-items: center; justify-content: center; font-weight: 700; margin-bottom: 10px; }
.step-card h3 { font-size: 1.05em; margin: 0 0 8px; }
.step-card p { margin: 0; font-size: .92em; color: var(--muted); }
.grid-3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px; }

/* ── Skills (chips) ───────────────────────────────────── */
.chip-row { display: flex; gap: 10px; flex-wrap: wrap; margin: 10px 0 22px; }
.chip { border: 1px solid var(--line); border-radius: 999px; padding: 6px 14px; font-size: .88em; background: #fff; }
.chip.solid { background: var(--accent); color: #fff; border-color: var(--accent); }
.skill-groups { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 22px; margin-top: 18px; }
.skill-groups h3 { font-size: 1em; margin-bottom: 8px; }
.skill-groups ul { margin: 0; padding-left: 18px; color: var(--muted); }

/* ── Portfolio grid ───────────────────────────────────── */
#portfolio { position: relative; isolation: isolate; }
#portfolio.portfolio-3d-active > .container { position: relative; z-index: 1; }
.portfolio-3d__canvas { position: absolute; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; }
.portfolio-3d__canvas canvas { display: block; width: 100%; height: 100%; opacity: .32; }
.portfolio-3d__fallback { position: absolute; inset: 0; opacity: .26;
    background: radial-gradient(900px 520px at 50% 45%, #c4b5fd 0%, #ede9fe 48%, transparent 82%); }
#portfolio.portfolio-3d-active .pcard { background: rgba(255,255,255,.82); }
#portfolio.portfolio-3d-active .pcard .body { background: rgba(255,255,255,.88); }
@media (prefers-reduced-motion: reduce) { .portfolio-3d__canvas canvas { display: none; } }
.pgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 16px; }
.pcard { display: block; border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; text-decoration: none; color: inherit; background: #fff; transition: transform .25s ease, box-shadow .25s ease; transform-style: preserve-3d; }
/* Cena 3 etapa 1 (F3-03, Guia §7): tilt 3D por CSS — barato e acessível */
.pcard:hover { transform: perspective(800px) rotateX(4deg) rotateY(-4deg) translateY(-4px); box-shadow: 0 10px 24px rgba(17,24,39,.08); }
@media (prefers-reduced-motion: reduce) { .pcard:hover { transform: none; } }
.pcard .thumb { aspect-ratio: 4 / 3; display: flex; align-items: center; justify-content: center; background: linear-gradient(135deg, #ede9fe, #faf5ff); color: var(--accent); font-size: 2.4em; font-weight: 800; }
.pcard .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.pcard .body { padding: 14px; }
.pcard .body strong { display: block; }
.pcard .body small { color: var(--muted); display: block; margin-top: 4px; }
.badge { display: inline-block; font-size: .72em; font-weight: 700; background: #ede9fe; color: var(--accent); border-radius: 999px; padding: 2px 10px; margin-top: 8px; }
.filter-chips { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 18px; }
.filter-chips .chip { text-decoration: none; }
.filter-chips .chip.active { background: var(--accent); color: #fff; border-color: var(--accent); }

/* ── Depoimentos / clientes / ferramentas ─────────────── */
.quote-card { border-left: 4px solid var(--accent); background: var(--card); border-radius: 0 var(--radius) var(--radius) 0; padding: 18px 20px; }
.quote-card p { margin: 0 0 10px; }
.quote-card footer { color: var(--muted); font-size: .9em; }
.client-pills { display: flex; gap: 14px; flex-wrap: wrap; }
.client-pill { display: inline-flex; align-items: center; gap: 10px; border: 1px solid var(--line); border-radius: 999px; padding: 8px 16px 8px 8px; background: #fff; }
.client-pill .monogram { width: 34px; height: 34px; border-radius: 50%; background: linear-gradient(135deg, var(--accent), #a78bfa); color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: .85em; }
#tools { position: relative; isolation: isolate; overflow: hidden; }
#tools.tools-3d-active > .container { position: relative; z-index: 1; }
.tools-3d__canvas { position: absolute; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; }
.tools-3d__canvas canvas { display: block; width: 100%; height: 100%; opacity: .72; }
.tools-3d__fallback { position: absolute; inset: 0; opacity: .22;
    background: radial-gradient(760px 420px at 50% 48%, #c4b5fd 0%, #ede9fe 50%, transparent 84%); }
#tools.tools-3d-active .tool-card { background: rgba(255,255,255,.78); }
#tools.tools-3d-active .tool-card:nth-child(-n+4) .tool-icon { visibility: hidden; }
@media (prefers-reduced-motion: reduce) { .tools-3d__canvas canvas { display: none; } }
.tool-card { border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; background: #fff; }
.tool-card .tool-icon { width: 40px; height: 40px; border-radius: 10px; background: #ede9fe; color: var(--accent); display: flex; align-items: center; justify-content: center; font-weight: 800; margin-bottom: 10px; }
.tool-card p { color: var(--muted); font-size: .92em; margin: 6px 0 0; }

/* ── Rodapé ───────────────────────────────────────────── */
.site-footer { border-top: 1px solid var(--line); margin-top: 40px; padding: 32px 24px; }
.site-footer .container { display: flex; gap: 24px; flex-wrap: wrap; align-items: center; justify-content: space-between; }
.site-footer small { color: var(--muted); }
.site-footer nav { display: flex; gap: 14px; flex-wrap: wrap; }
.site-footer nav a { color: var(--muted); text-decoration: none; font-size: .9em; }

@media (max-width: 640px) {
    .hero h1 { font-size: 2.2em; }
    .section { padding: 40px 0; }
}

/* F12-01 — slot declarativo de cena Three.js.
   O canvas e criado pelo scene-runner; o gradiente permanece como fallback
   quando WebGL, IntersectionObserver/ResizeObserver ou a animacao estao
   indisponiveis (o proprio runner remove [data-fallback] ao inicializar). */
.theme-scene {
  position: relative;
  min-height: 260px;
  overflow: hidden;
  background: radial-gradient(circle at 30% 20%, rgba(109, 40, 217, .22), transparent 60%),
              linear-gradient(135deg, var(--theme-surface, #ffffff), rgba(13, 110, 253, .08));
}
.theme-scene__fallback {
  position: absolute;
  inset: 0;
  background: inherit;
}
.theme-scene canvas {
  display: block;
  width: 100%;
  height: 100%;
}
@media (prefers-reduced-motion: reduce) {
  .theme-scene { min-height: 180px; }
}

/* F13-B — design tokens. Os valores chegam por --rms-* no style do <body>;
   este bloco apenas os consome, com fallbacks para temas sem tokens. */
body {
  --rms-color-text: var(--rms-light-text, #212529);
  --rms-color-muted: var(--rms-light-muted, #5c6773);
  --rms-color-surface: var(--rms-light-surface, #ffffff);

  background-color: var(--rms-color-surface);
}
[data-bs-theme="dark"] body {
  --rms-color-text: var(--rms-dark-text, #dee2e6);
  --rms-color-muted: var(--rms-dark-muted, #9aa4ae);
  --rms-color-surface: var(--rms-dark-surface, #212529);
  --rms-color-primary: var(--rms-dark-primary, #6ea8fe);
}
h1, h2, h3, h4, h5, h6 { font-weight: var(--rms-heading-weight, 700); }
h1 { font-size: calc(var(--rms-font-size, 16px) * var(--rms-font-scale, 1.25) * var(--rms-font-scale, 1.25) * var(--rms-font-scale, 1.25)); }

h3 { font-size: calc(var(--rms-font-size, 16px) * var(--rms-font-scale, 1.25)); }
a, .text-muted, .kicker { color: var(--rms-color-muted); }
.btn.primary, .badge-status { border-radius: var(--rms-radius, 12px); }
.btn, .card, .hero, .theme-scene {
  border-radius: var(--rms-radius, 12px);
  border-width: var(--rms-border-width, 1px);
  box-shadow: var(--rms-shadow, none);
}
.card, .hero { border-top-left-radius: var(--rms-radius-lg, 20px); border-bottom-right-radius: var(--rms-radius-lg, 20px); }
.section, .hero-3d__content, .site-footer .container {
  padding-block: calc(var(--rms-space, 8px) * 3 * var(--rms-space-mult, 1));
}
.container { max-width: var(--rms-content-width, 1200px); }
:focus-visible { outline: 2px solid var(--rms-focus-ring, #0a58ca); outline-offset: 2px; }


/* ==========================================================================
   Frente AB — composição visual publicada (KAZTheme-Editor -> Catalogo)

  position: relative; width: 100%; max-width: var(--rms-content-width, 1200px);
  margin: 0 auto; overflow: hidden; border-radius: var(--rms-radius-lg, 20px);
  background: var(--theme-surface, #ffffff);

  background-size: 16px 16px;
  container-type: inline-size;

.rms-scene__layer {

.rms-scene__role--surface { background-color: var(--theme-surface, #ffffff) !important; }
@container (max-width: 620px) {

}
@media (max-width: 720px) {
