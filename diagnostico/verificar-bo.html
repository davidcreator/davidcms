<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BO-r3 — Diagnóstico do 3D</title>
<style>
:root{color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;padding:28px;background:#121516;color:#dfdfdf;
 font:14px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
.wrap{max-width:900px;margin:0 auto}
h1{font-size:1.35rem;letter-spacing:.06em;margin:0 0 4px;color:#5cc6d0}
.sub{color:#a7b3b5;font-size:.85rem;margin-bottom:22px}
button{background:#5cc6d0;color:#121516;border:0;border-radius:6px;padding:9px 16px;
 font-weight:700;cursor:pointer;letter-spacing:.04em}
button:hover{filter:brightness(1.1)}
.card{background:#1a1f21;border:1px solid #323a3d;border-radius:8px;padding:16px 18px;margin:14px 0}
.card h2{font-size:.78rem;text-transform:uppercase;letter-spacing:.14em;color:#a7b3b5;margin:0 0 12px}
.row{display:flex;align-items:center;gap:10px;padding:7px 0;border-top:1px solid #262c2e;
 flex-wrap:wrap}
.row:first-of-type{border-top:0}
.tag{font-size:.66rem;font-weight:700;letter-spacing:.1em;padding:3px 8px;border-radius:4px;
 min-width:52px;text-align:center}
.ok{background:#1d4732;color:#7fdc8c}
.bad{background:#4a2326;color:#eb767e}
.wait{background:#3a3520;color:#ffdf00}
code{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:.82rem;
 word-break:break-all;color:#dfdfdf}
.meta{color:#a7b3b5;font-size:.78rem}
#veredito{font-size:1rem;line-height:1.6;padding:16px 18px;border-radius:8px;margin:18px 0;
 border:1px solid #323a3d;background:#1a1f21}
#veredito.bom{border-color:#7fdc8c;background:#16271c}
#veredito.ruim{border-color:#eb767e;background:#2a191b}
ul{margin:10px 0 0;padding-left:20px}
li{margin:5px 0}
small{color:#a7b3b5}
</style>
</head>
<body>
<div class="wrap">
 <h1>BO-r3 — Diagnóstico do 3D</h1>
 <div class="sub">Coloque este arquivo na <b>raiz do site</b> e abra <code>https://seusite/verificar-bo.html</code>.
 Same-origin, sem console, sem DevTools, sem alterar nada no servidor.</div>
 <button id="btn">Executar diagnóstico</button>
 <div id="saida"></div>
</div>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const row = (estado, nome, detalhe) =>
  '<div class="row"><span class="tag '+estado+'">'+
  (estado==='ok'?'OK':estado==='bad'?'FALHA':'…')+'</span>'+
  '<code>'+esc(nome)+'</code><span class="meta">'+esc(detalhe)+'</span></div>';

async function head(url){
  try{
    const r = await fetch(url, {cache:'no-store'});
    const ct = r.headers.get('content-type') || '(sem content-type)';
    const txt = r.ok ? await r.text() : '';
    return {status:r.status, ct, ok:r.ok && /javascript|ecmascript/i.test(ct),
            tam:txt.length, corpo:txt.slice(0,120)};
  }catch(e){ return {status:0, ct:String(e), ok:false, tam:0, corpo:''}; }
}

async function run(){
  const out = $('#saida');
  out.innerHTML = '<div class="card"><h2>Executando</h2>'+row('wait','buscando a home…','')+'</div>';
  let base = location.origin + '/';
  let html = '', slot = null, importmap = null, modulo = null;

  // 1) Busca a home e inspeciona o HTML que o CMS realmente entregou
  try{
    const r = await fetch(base + '?language=es-eu', {cache:'no-store'});
    html = await r.text();
    const doc = new DOMParser().parseFromString(html, 'text/html');
    slot      = doc.querySelector('[data-scene]');
    importmap = doc.querySelector('script[type="importmap"]');
    modulo    = doc.querySelector('script[type="module"][src]');
    let m = null;
    if (importmap) { try { m = JSON.parse(importmap.textContent); } catch(e){} }
    const threeUrl = m && m.imports && m.imports['three'];
    if (threeUrl) base = new URL(threeUrl.replace(/three\.module\.js.*$/, ''), location.href).href;
  }catch(e){ /* segue com a base padrao */ }

  const urls = {
    'three/main.js':                    base + 'three/main.js',
    'three/scenes/david-universe.js':   base + 'three/scenes/david-universe.js',
    'three/core/scene-runner.js':       base + 'three/core/scene-runner.js',
    'three/core/dom.js':                base + 'three/core/dom.js',
    'three.module.js':                  base + 'three.module.js',
    'three.core.js':                    base + 'three.core.js'
  };

  let s1 = '<div class="card"><h2>1 · HTML da home</h2>';
  s1 += slot
    ? row('ok', '[data-scene]', 'scene=' + (slot.dataset.scene||'(vazio)') +
        ' · count=' + (slot.dataset.count||'?') + ' · slot=' + (slot.className||''))
    : row('bad', '[data-scene]', 'AUSENTE — theme-scene.twig não emitiu o slot (allowlists / tema não ativo)');
  s1 += importmap ? row('ok','importmap', 'presente · three → ' + esc((JSON.parse(importmap.textContent||'{}').imports||{}).three||'?'))
                  : row('bad','importmap','AUSENTE — has_3d falso: catalog_theme_three.enabled ou three_hero_enabled');
  s1 += modulo ? row('ok','<script type=module>', esc(modulo.getAttribute('src')))
               : row('bad','<script type=module>','AUSENTE — o main.js não foi incluído no <head>');
  s1 += row(slot && slot.dataset.scene === 'david-universe' ? 'ok':'bad',
            'cena esperada', slot ? ('david-universe'+(slot.dataset.scene==='david-universe'?' ✓':' — veio '+slot.dataset.scene)) : 'sem slot');
  s1 += row('wait','base do runtime', esc(base));
  s1 += '</div>';
  out.innerHTML = s1 + '<div class="card"><h2>2 · Buscando os módulos…</h2></div>';

  // 2) Cada URL do runtime: status + MIME
  const res = {};
  let s2 = '<div class="card"><h2>2 · Módulos no servidor</h2>';
  for (const [nome, url] of Object.entries(urls)) {
    const r = await head(url);
    res[nome] = r;
    s2 += row(r.ok ? 'ok':'bad', nome,
      'HTTP ' + r.status + ' · ' + r.ct + ' · ' + r.tam + ' bytes' +
      (r.status===404 ? ' ← 404: arquivo novo não foi copiado' : ''));
  }
  s2 += '</div>';

  // 3) Veredito
  const novo = res['three/scenes/david-universe.js'];
  const main = res['three/main.js'];
  let cls='ruim', msg='', passos=[];
  if (novo && !novo.ok) {
    msg = '<b>ELO 3 QUEBRADO — é quase certo que é aqui.</b><br>' +
      '<code>three/scenes/david-universe.js</code> respondeu HTTP ' + novo.status +
      '. O <code>main.js</code> faz <code>import \'./scenes/david-universe.js\'</code>; ' +
      'um único import com 404 <b>aborta o módulo ES inteiro</b> e nenhuma cena (nem as 4 antigas) é registrada.';
    passos = [
      'Confirme que existe <code>dev/system/library/three/runtime/three/scenes/david-universe.js</code> no servidor.',
      'Se faltar, rode <code>python3 instalar-bo.py --repo /caminho/do/davidcms --apply</code> (copia os 10 arquivos, incluindo o novo).',
      'Confirme que <code>asset_manifest.php</code> tem a linha <code>\'three/scenes/david-universe.js\' =&gt; \'runtime/three/scenes/david-universe.js\'</code>.',
      'Limpe o cache de opcode/Twig e recarregue.'
    ];
  } else if (!slot || slot.dataset.scene !== 'david-universe') {
    msg = '<b>ELO 1/5 QUEBRADO — o slot declarativo não chegou ao HTML.</b><br>' +
      'O tema ainda não está ativo, ou as allowlists PHP (<code>theme_package</code>, ' +
      '<code>condition_engine</code>, <code>theme_snapshot</code>, <code>scene_preset_registry</code>, admin) não foram patchadas.';
    passos = ['Aplique o <code>PATCH-BO.diff</code> completo.',
              'Importe <code>david_universe_3d_bo.reamurtheme.json</code> e <b>ATIVE</b> o tema no Admin (activate() publica; save() só rascunho).'];
  } else if (!importmap || !modulo) {
    msg = '<b>ELO 4 QUEBRADO — o header não carregou o runtime.</b><br>' +
      '<code>has_3d</code> está falso. O header lê <code>catalog_theme_three.enabled</code>; ' +
      'o <code>home.php</code> lê <code>three_hero_enabled</code>.';
    passos = ['Confirme o patch em <code>common/home.php</code> (mapeamento david-universe → three_hero_enabled).',
              'Confirme <code>three.enabled = true</code> no tema e no snapshot.',
              'Limpe o cache do CMS.'];
  } else if (main && !main.ok) {
    msg = '<b>ELO 2 QUEBRADO — <code>three/main.js</code> não responde como JS.</b>';
    passos = ['Verifique a rota <code>/three-runtime/</code> e o <code>ControllerCommonThree::asset()</code>.'];
  } else {
    cls='bom';
    msg = '<b>Todos os módulos respondem 200 com MIME JavaScript e o slot está correto.</b><br>' +
      'Se ainda assim não aparecer nada, restam três causas: ' +
      '<code>prefers-reduced-motion: reduce</code> ativo (o SceneRunner desliga o WebGL por desenho), ' +
      'WebGL indisponível no navegador, ou canvas atrás do conteúdo por CSS. ' +
      'Abra o Console e veja se há erro de import; me mande a aba Network dessas URLs.';
    passos = ['Desligue "reduzir movimento" no SO/navegador e recarregue.',
              'Teste em outro navegador com aceleração de hardware.',
              'Se o canvas existir mas estiver invisível, verifique o z-index do <code>.theme-scene</code>.'];
  }
  const s3 = '<div id="veredito" class="'+cls+'">'+msg+'<ul>'+passos.map(p=>'<li>'+p+'</li>').join('')+'</ul></div>';

  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let gl=false; try{const c=document.createElement('canvas');
    gl=!!(c.getContext('webgl2')||c.getContext('webgl'));}catch(e){}
  const s4 = '<div class="card"><h2>3 · Navegador</h2>'+
    row(gl?'ok':'bad','WebGL disponível', gl?'sim':'não')+
    row(reduced?'bad':'ok','prefers-reduced-motion', reduced?'REDUCE ativo — sem WebGL por desenho':'normal')+
    '</div><small>Diagnóstico somente-leitura. Não altera arquivos, não chama API nem escreve no GitHub.</small>';

  out.innerHTML = s1 + s2 + s3 + s4;
}
$('#btn').addEventListener('click', run);
run();
</script>
</body>
</html>
